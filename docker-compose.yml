# Banco e Redis pra desenvolvimento local. Em produção é Supabase + Railway.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fuckingbarba
      POSTGRES_PASSWORD: fuckingbarba
      POSTGRES_DB: fuckingbarba
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuckingbarba"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"

volumes:
  postgres:
