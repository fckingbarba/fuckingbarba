name: loja

on:
  workflow_dispatch: # permite rodar na mão pela aba Actions
  pull_request:
    paths:
      [
        "apps/loja/**",
        "package.json",
        "package-lock.json",
        "turbo.json",
        ".github/workflows/loja.yml",
      ]
  push:
    branches: [main, staging]
    paths:
      [
        "apps/loja/**",
        "package.json",
        "package-lock.json",
        "turbo.json",
        ".github/workflows/loja.yml",
      ]

concurrency:
  group: loja-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: tipos · lint · build · Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build "indexável" só pra medir SEO = 100 no Lighthouse; a Vercel decide o de verdade por VERCEL_ENV.
      SITE_INDEXAVEL: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_PUBLIC_LOJA_ATUAL_URL: https://exemplo.com.br
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @fuckingbarba/loja
      - run: npm run lint -w @fuckingbarba/loja
      - run: npm run build -w @fuckingbarba/loja
      - name: Lighthouse CI (orçamentos em apps/loja/budgets.json)
        working-directory: apps/loja
        run: npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: apps/loja/.lighthouseci
          retention-days: 14
